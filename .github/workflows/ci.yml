name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Fails if models have changed without a generated migration.
      - run: uv run python manage.py makemigrations --check --dry-run

  test:
    name: Tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: menuapi
          POSTGRES_USER: menuapi
          POSTGRES_PASSWORD: menuapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menuapi -d menuapi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://menuapi:menuapi@localhost:5432/menuapi
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t menuapi:ci .
