services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menuapi
      POSTGRES_USER: menuapi
      POSTGRES_PASSWORD: menuapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuapi -d menuapi"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    environment:
      DATABASE_URL: postgres://menuapi:menuapi@db:5432/menuapi
      ALLOWED_HOSTS: "*"
      DEBUG: "false"
      # Demo-only; production sets CORS_ALLOWED_ORIGINS explicitly instead.
      CORS_ALLOW_ALL_ORIGINS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
